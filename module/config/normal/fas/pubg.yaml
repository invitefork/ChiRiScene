# pubg.yaml: FAS config for com.tencent.ig (PUBG Mobile global), MT6897 first port, untested.
# fps_gears must cover the in-game selectable FPS levels.
fas_rules:
  fps_gears: [30.0, 60.0, 90.0, 120.0]
  fps_margin: 3.0
  per_app_profiles:
    com.tencent.ig:
      target_fps: [60, 90, 120]
      fps_margin: 3.0
  perf_init: 0.50
  migration_cost_ns: 400000
  core_temp_threshold: 0.0
