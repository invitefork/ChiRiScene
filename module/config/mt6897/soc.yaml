# mt6897/soc.yaml: [topology] [freq] [cpu_governors]
# SoC 硬件基线：编译期嵌入（同 feature.yaml，防篡改、磁盘不落盘）。
# 定位 = 运行时 sysfs 探测的兜底与校准基准，不是调优输入；改动需重编。
# 机型：Dimensity 8300 Ultra（MT6897）/ Poco X6 Pro（duchamp），Android 15，GKI 6.1。
soc: "mt6897"

# [topology] 核心组 CPU ID 区间（左闭右开），common.rs::chiri_core_ranges 的数据源。
# 真机 policy 布局：policy0 = CPU0-3（A510）/ policy4 = CPU4-6（A715）/ policy7 = CPU7（A715 prime），
# 即 4+3+1 三 policy，与 zumapro 同形（高通 8550 是 3+4+1，勿混）。
topology:
  little: { start: 0, end: 4 }
  big: { start: 4, end: 7 }
  prime: { start: 7, end: 8 }

# [capacity] TODO: 真机 cpu_capacity 未采样，暂不填（运行时优先读 sysfs，本段只是读不到时的兜底）。
# 影响面：仅帕累托前沿的需求折算与 FDP，本机无 frontier_policy，当前不受影响。
# 采样命令：for c in 0 4 7; do cat /sys/devices/system/cpu/cpu$c/cpu_capacity; done

# [freq] 频率档位兜底（kHz 升序；scaling_available_frequencies 读不到时用）。
# 来源：真机 scaling_available_frequencies 输出（升序重排）。
# 写 scaling_max_freq 前须 floor 对齐到表内档位（内核 clamp 向下取最近档）。
freq_khz:
  # little / policy0：18 档 480000-2200000
  little:
    [
      480000,
      600000,
      700000,
      800000,
      900000,
