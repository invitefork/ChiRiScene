      1600000,
      1700000,
      1800000,
      1900000,
      2000000,
      2100000,
      2200000,
    ]
  # big / policy4：30 档 400000-3200000
  big:
    [
      400000,
      500000,
      600000,
      700000,
      800000,
      900000,
      1000000,
      1100000,
      1200000,
      1300000,
      1400000,
      1500000,
      1600000,
      1700000,
      1800000,
      1900000,
      2000000,
      2100000,
      2200000,
      2300000,
      2400000,
      2500000,
      2600000,
      2660000,
      2800000,
      2850000,
      2900000,
