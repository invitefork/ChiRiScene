# [cpu_governors] cpufreq 调速器优先级（从左到右）：启动时逐 policy 读
# scaling_available_governors，取第一个该 policy 可用的作为「默认调速器」。
# 本机可用：sugov_ext（联发科自家）/ conservative / ondemand / powersave / performance / schedutil。
# 首轮取 schedutil 打头：项目在 schedutil 上验证最充分；sugov_ext 带厂商钩子，可能与 CLG 的
# 上限写入互相打架，作为第二位备选（若想贴近出厂行为，可把 sugov_ext 提到首位再对比）。
# performance 是兜底，放最后一位防止前面全部不可用。
cpu_governors: [schedutil, sugov_ext, performance]
